<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage - Slide 3</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide-content {
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .usage-steps {
            font-size: 1.2rem;
            line-height: 2;
            text-align: left;
        }
        .step {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <h1>How to Use</h1>
        <div class="usage-steps">
            <div class="step">1️⃣ Navigate with arrow keys or click buttons</div>
            <div class="step">2️⃣ Press F for fullscreen mode</div>
            <div class="step">3️⃣ Use Home/End for first/last slide</div>
            <div class="step">4️⃣ Click thumbnails for quick navigation</div>
        </div>
    </div>
</body>
</html>
