<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Overview - Business Strategy 2024</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide-content {
            max-width: 900px;
            text-align: center;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .overview {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .metric {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <h1>📊 Executive Overview</h1>
        <div class="overview">
            Strategic business objectives for 2024 focused on growth, innovation, and market expansion.
        </div>
        <div class="metrics">
            <div class="metric">
                <div class="metric-value">25%</div>
                <div>Revenue Growth</div>
            </div>
            <div class="metric">
                <div class="metric-value">3</div>
                <div>New Markets</div>
            </div>
            <div class="metric">
                <div class="metric-value">50+</div>
                <div>Team Members</div>
            </div>
        </div>
    </div>
</body>
</html>
