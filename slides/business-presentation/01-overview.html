<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Overview - Business Strategy 2024</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-content {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .metric-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 10px;
        }

        .metric-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .objectives {
            margin-top: 50px;
            text-align: center;
        }

        .objectives h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #FFD700;
        }

        .objectives ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .objectives li {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
            .overview-grid { grid-template-columns: 1fr; gap: 20px; }
            .objectives ul { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <h1>Business Strategy 2024</h1>
        <div class="subtitle">Executive Overview</div>
        
        <div class="overview-grid">
            <div class="metric-card">
                <div class="metric-number">25%</div>
                <div class="metric-label">Revenue Growth Target</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-number">3</div>
                <div class="metric-label">New Market Segments</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-number">$2.5M</div>
                <div class="metric-label">Investment Budget</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-number">12</div>
                <div class="metric-label">Months Timeline</div>
            </div>
        </div>

        <div class="objectives">
            <h2>Key Objectives</h2>
            <ul>
                <li>Expand Digital Presence</li>
                <li>Enhance Customer Experience</li>
                <li>Streamline Operations</li>
                <li>Develop New Products</li>
                <li>Strengthen Partnerships</li>
            </ul>
        </div>
    </div>
</body>
</html>
