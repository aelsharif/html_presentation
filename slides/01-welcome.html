<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Slide 1</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .slide-content {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 30px;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .welcome-message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .navigation-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .welcome-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide-content">
        <h1>Welcome</h1>
        <div class="subtitle">HTML Presentation System</div>
        <div class="welcome-message">
            This is a fully functional HTML presentation system with keyboard navigation support.
            <br><br>
            Use the arrow keys or navigation buttons to move between slides.
        </div>
    </div>
    
    <div class="navigation-hint">
        Use ← → arrow keys or navigation buttons to navigate
    </div>
</body>
</html>
