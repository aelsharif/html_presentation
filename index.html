<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Presentation System</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .redirect-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        .loader {
            margin: 20px 0;
            font-size: 2rem;
            color: #4CAF50;
        }
        .redirect-message {
            font-size: 1.2rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        .manual-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        .manual-link:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="loader">
            <i class="fas fa-spinner fa-spin"></i>
        </div>
        <div class="redirect-message">
            Redirecting to Presentation Dashboard...
        </div>
        <p>If you're not redirected automatically, click the link below:</p>
        <a href="dashboard.html" class="manual-link">Go to Dashboard</a>
    </div>

    <script>
        // Automatic redirect to dashboard after a short delay
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 2000);
    </script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</body>
</html>
